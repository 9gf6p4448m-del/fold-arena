<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#16181d">
    <link rel="manifest" href="manifest.json">
    <title>FOLD ARENA v0.4.1</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #16181d;
                   touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none;
                   -webkit-touch-callout: none; }
      #unity-canvas { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; outline: none;
                      background: #1F1F20; }
      #fa-version { position: fixed; left: 50%; bottom: 4px; transform: translateX(-50%); z-index: 10; pointer-events: none; white-space: nowrap;
                    font: 11px/1.3 ui-monospace, Menlo, Consolas, monospace; color: rgba(255,255,255,0.7);
                    text-align: center; text-shadow: 0 1px 2px #000; }
      #fa-loading { position: fixed; left: 0; right: 0; top: 44%; z-index: 9; text-align: center;
                    font: 15px/1.6 system-ui, sans-serif; color: #e8e8e8; }
      #fa-bar { width: 60%; max-width: 420px; height: 6px; margin: 10px auto 0; background: rgba(255,255,255,0.18); border-radius: 3px; overflow: hidden; }
      #fa-bar-fill { width: 0%; height: 100%; background: #6fc3ff; transition: width 0.15s linear; }
      #fa-error { display: none; color: #ff8a70; white-space: pre-wrap; padding: 0 16px; }
      /* 橫式遊戲：手機直立時蓋一層提示 */
      #fa-rotate { display: none; position: fixed; inset: 0; z-index: 20; background: #16181d; color: #e8e8e8;
                   font: 18px/1.6 system-ui, sans-serif; align-items: center; justify-content: center; text-align: center; }
      @media (orientation: portrait) and (pointer: coarse) { #fa-rotate { display: flex; } }
      /* P1-04B 量測模式（?bench）的結果面板 */
      #fa-bench { display: none; position: fixed; left: 50%; top: 8px; transform: translateX(-50%); z-index: 30; max-width: 94vw;
                  background: rgba(10,14,24,0.94); color: #e8f1ff; border: 1px solid #31dfff; border-radius: 8px; padding: 8px 12px;
                  font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace; white-space: pre-wrap; touch-action: auto; }
      #fa-bench button { font: 14px system-ui, sans-serif; margin: 6px 6px 0 0; padding: 6px 12px; border-radius: 6px;
                         border: 1px solid #31dfff; background: #13233a; color: #e8f1ff; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>

    <div id="fa-loading">
      <div id="fa-loading-text">載入中…</div>
      <div id="fa-bar"><div id="fa-bar-fill"></div></div>
      <div id="fa-error"></div>
    </div>

    <div id="fa-rotate">請把手機橫放<br>（建議先關閉螢幕方向鎖定）</div>

    <!-- 版本列：判斷「看到的是不是剛部署的那一版」只看這一行。版本號來自 Assets/Scripts/Core/FoldArenaVersion.cs，建置時間與 commit 由建置器寫入。 -->
    <div id="fa-version">FOLD ARENA v0.4.1<br>build 2026-10-12 13:40 UTC · 13523bf</div>

    <div id="fa-bench"><div id="fa-bench-text"></div><div id="fa-bench-buttons" style="display:none"><button id="fa-bench-copy">複製 JSON</button><button id="fa-bench-dl">下載 JSON</button><button id="fa-bench-close">關閉</button></div></div>

    <script>
      // P1-04B 量測模式（Docs/P1_04B_ACCEPTANCE.md M5～M7）：只有網址帶 ?bench 才啟用。
      (function () {
        // 與 C# BenchOptions.Parse 相同的規則：鍵名逐字比對（不解碼），值才解碼（ARENA4 R2-L5）
        var q = { keys: {} };
        location.search.replace(/^\?/, "").split("#")[0].split("&").forEach(function (part) {
          if (!part) return;
          var eq = part.indexOf("=");
          var key = eq < 0 ? part : part.substring(0, eq);
          // 重複鍵取最後一個；值解碼失敗保留原字串（與 C# Uri.UnescapeDataString 一樣寬容，ARENA4 R3 LOW-4）
          var raw = eq < 0 ? "" : part.substring(eq + 1), val = raw;
          try { val = decodeURIComponent(raw); } catch (e) {}
          q.keys[key] = val;
        });
        q.has = function (k) { return k in q.keys; };
        if (!q.has("bench")) return;
        var fb = window.faBench = { events: [], idle: null, start: null, end: null, result: null, shot: null,
                                    pageFrames: [], canvasAtStart: null, wakeLock: "未嘗試" };
        var panel = document.querySelector("#fa-bench"), text = document.querySelector("#fa-bench-text");
        function log(type) { fb.events.push({ t: Math.round(performance.now()), type: type }); }
        document.addEventListener("visibilitychange", function () { log("visibility:" + document.visibilityState); });
        window.addEventListener("blur", function () { log("blur"); });
        window.addEventListener("focus", function () { log("focus"); });
        window.addEventListener("pagehide", function () { log("pagehide"); });
        window.addEventListener("resize", function () { log("resize"); });
        function rate(stamps) {
          // 總跨度 ÷ 間隔數（瀏覽器時間戳約 1 ms 解析度，取中位數會有 3～4 Hz 階距，ARENA4 MEDIUM-1）
          var n = stamps.length - 1;
          if (n < 1) return null;
          var span = stamps[n] - stamps[0];
          var d = [];
          for (var i = 1; i < stamps.length; i++) d.push(stamps[i] - stamps[i - 1]);
          d.sort(function (a, b) { return a - b; });
          return { intervals: n, spanMs: Math.round(span * 1000) / 1000, hz: Math.round(n * 1000000 / span) / 1000,
                   medianIntervalMs: d[d.length >> 1], maxIntervalMs: d[n - 1] };
        }
        // 顯示更新率（裝置條件）：只看「正常」的間隔——先取中位數，排除偏離中位數 50% 以上的間隔（載入期停頓），
        // 剩下的取平均換算 Hz。總跨度÷間隔數會被載入期停頓拉低（ARENA3 實測 60 Hz 量成 47.6），
        // 單取中位數又只有 1 ms 級解析度（ARENA4 MEDIUM-1）；兩者折衷。
        function displayRate(stamps) {
          var d = [];
          for (var i = 1; i < stamps.length; i++) d.push(stamps[i] - stamps[i - 1]);
          if (!d.length) return null;
          var sorted = d.slice().sort(function (a, b) { return a - b; });
          var med = sorted[sorted.length >> 1];
          var kept = d.filter(function (x) { return x >= med * 0.5 && x <= med * 1.5; });
          var sum = kept.reduce(function (a, b) { return a + b; }, 0);
          return { intervals: d.length, kept: kept.length, medianIntervalMs: med, maxIntervalMs: sorted[sorted.length - 1],
                   hz: Math.round(kept.length * 1000000 / sum) / 1000, spanHz: rate(stamps).hz };
        }
        // 實際顯示更新率：Unity 載入前以 requestAnimationFrame 量 2 秒
        var idleStamps = [];
        function probe(t) {
          idleStamps.push(t);
          if (t - idleStamps[0] < 2000) { requestAnimationFrame(probe); return; }
          fb.idle = displayRate(idleStamps);
        }
        requestAnimationFrame(probe);
        // 量測期間另以頁面端 rAF 記錄間隔（獨立於 Unity 時鐘，用來交叉核對 frameTimesMs）
        function pageFrame(t) {
          if (fb.start === null || fb.end !== null) return;
          fb.pageFrames.push(t);
          requestAnimationFrame(pageFrame);
        }
        function show(msg) { panel.style.display = "block"; text.textContent = msg; }
        if (!q.has("shot")) show("量測模式：預熱 5 秒後量 60 秒，期間請勿切換分頁或鎖定螢幕");
        function canvasSize() { return [canvas.width, canvas.height, canvas.clientWidth, canvas.clientHeight]; }
        fb.mark = function (what) {
          if (what === "start") {
            fb.start = performance.now();
            fb.startedAtEpochMs = Date.now();
            fb.canvasAtStart = canvasSize();
            // 不依賴 document.hasFocus()：iOS Safari 畫布未取得焦點時的回傳值未經實機確認（ARENA4 R3 MEDIUM-4）。
            // 改用：可見，且開始前最後一個焦點類事件不是 blur（預熱期失焦後未回焦即無效）
            var lastFocusEvent = null;
            fb.events.forEach(function (e) { if (e.type === "blur" || e.type === "focus") lastFocusEvent = e.type; });
            fb.focusAtStart = document.visibilityState === "visible" && lastFocusEvent !== "blur";
            requestAnimationFrame(pageFrame);
            show("量測中（60 秒）…請勿切換分頁");
            // 量測期間要求螢幕不自動鎖定（Safari 16.4+）；失敗只記錄，鎖屏會被 visibility 偵測判為無效
            if (navigator.wakeLock && navigator.wakeLock.request) {
              navigator.wakeLock.request("screen").then(function () { fb.wakeLock = "已取得"; },
                                                        function (e) { fb.wakeLock = "失敗：" + e.name; });
            } else fb.wakeLock = "不支援";
          }
          if (what === "end") { fb.end = performance.now(); fb.endedAtEpochMs = Date.now(); }
        };
        function env() {
          var dpr = window.devicePixelRatio || 1;
          return {
            userAgent: navigator.userAgent,
            devicePixelRatio: dpr,
            unityPixelRatioConfigured: Math.min(dpr, 2),
            unityPixelRatioActual: canvas.clientWidth ? Math.round(canvas.width / canvas.clientWidth * 1000) / 1000 : null,
            canvasPx: [canvas.width, canvas.height],
            cssPx: [window.innerWidth, window.innerHeight],
            screenPx: [screen.width, screen.height],
            orientation: (screen.orientation && screen.orientation.type) || (window.innerWidth > window.innerHeight ? "landscape" : "portrait"),
            idleDisplay: fb.idle,
            wakeLock: fb.wakeLock,
            buildStamp: document.querySelector("#fa-version").innerText.replace(/\s*\n\s*/g, " | "),
            url: location.href
          };
        }
        fb.publish = function (json) {
          var r = JSON.parse(json);
          r.env = env();
          r.pageDisplay = rate(fb.pageFrames);
          r.pageFrameTimesMs = [];
          for (var k = 1; k < fb.pageFrames.length; k++) r.pageFrameTimesMs.push(Math.round((fb.pageFrames[k] - fb.pageFrames[k - 1]) * 1000) / 1000);
          r.canvasAtStart = fb.canvasAtStart;
          r.startedAtEpochMs = fb.startedAtEpochMs || null;
          r.endedAtEpochMs = fb.endedAtEpochMs || null;
          r.canvasAtEnd = canvasSize();
          // 有效判定一律 fail-closed（ARENA4 MEDIUM-4）：缺起訖標記、量測期間背景／失焦／縮放、單格 > 500 ms、canvas 尺寸變動，都算無效
          var reasons = [];
          if (fb.start === null || fb.end === null) reasons.push("缺起訖標記");
          else fb.events.forEach(function (e) {
            if (e.t >= fb.start && e.t <= fb.end && e.type !== "focus" && e.type !== "visibility:visible") reasons.push(e.type);
          });
          if (document.visibilityState !== "visible") reasons.push("結束時頁面不可見");
          if (!fb.focusAtStart) reasons.push("量測開始時頁面不可見或預熱期失焦未回焦");
          if (r.summary.maxMs > 500) reasons.push("單格停頓 " + r.summary.maxMs.toFixed(0) + " ms");
          if (JSON.stringify(r.canvasAtStart) !== JSON.stringify(r.canvasAtEnd)) reasons.push("canvas 尺寸變動");
          r.valid = reasons.length === 0;
          r.invalidReasons = reasons;
          r.pageEvents = fb.events;
          fb.result = r;
          var s = r.summary, i = r.env.idleDisplay, p = r.pageDisplay;
          show((r.valid ? "✅ 有效" : "❌ 無效（" + reasons.join("、") + "）") +
               "\n平均 " + s.avgFps.toFixed(1) + " FPS｜1% low " + s.onePercentLowFps.toFixed(1) +
               "\np50 " + s.p50Ms.toFixed(2) + "｜p95 " + s.p95Ms.toFixed(2) + "｜p99 " + s.p99Ms.toFixed(2) + "｜max " + s.maxMs.toFixed(1) + " ms" +
               "\n影格 " + s.frames + "｜頁面 rAF " + (p ? p.hz + " Hz" : "—") + "｜閒置更新率 " + (i ? i.hz + " Hz" : "未量到") +
               "\ncanvas " + r.env.canvasPx.join("×") + "（像素比 " + r.env.unityPixelRatioActual + "）｜螢幕鎖定：" + r.env.wakeLock +
               "\n" + r.version + "｜" + r.pipeline + "｜" + r.colorSpace);
          document.querySelector("#fa-bench-buttons").style.display = "block";
        };
        fb.publishShot = function (json) { var r = JSON.parse(json); r.env = env(); fb.shot = r; };
        function payload() { return JSON.stringify(fb.result); }
        document.querySelector("#fa-bench-copy").addEventListener("click", function () {
          var data = payload(), btn = this;
          function fallback() {
            var ta = document.createElement("textarea"); ta.value = data; document.body.appendChild(ta);
            ta.select(); var ok = false; try { ok = document.execCommand("copy"); } catch (e) {} ta.remove();
            btn.textContent = ok ? "已複製" : "複製失敗，請用下載";
          }
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(data).then(function () { btn.textContent = "已複製"; }, fallback);
          } else fallback();
        });
        document.querySelector("#fa-bench-dl").addEventListener("click", function () {
          var r = fb.result, a = document.createElement("a");
          a.href = URL.createObjectURL(new Blob([payload()], { type: "application/json" }));
          a.download = "foldarena-bench-" + r.version + "-" + Date.now() + ".json";
          document.body.appendChild(a); a.click(); a.remove();
        });
        document.querySelector("#fa-bench-close").addEventListener("click", function () { panel.style.display = "none"; });
      })();
    </script>

    <!-- 建置檔網址帶 commit 快取鍵：Unity 檔名固定，否則瀏覽器可能用新 index.html 配舊 wasm（量到舊版卻顯示新戳記） -->
    <script src="Build/WebGL.loader.js?v=13523bf-202610121340"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var loading = document.querySelector("#fa-loading");
      var barFill = document.querySelector("#fa-bar-fill");
      var errorBox = document.querySelector("#fa-error");

      function showError(message) {
        document.querySelector("#fa-loading-text").textContent = "載入失敗";
        errorBox.style.display = "block";
        errorBox.textContent = message;
      }

      createUnityInstance(canvas, {
        dataUrl: "Build/WebGL.data.unityweb?v=13523bf-202610121340",
        frameworkUrl: "Build/WebGL.framework.js.unityweb?v=13523bf-202610121340",
        codeUrl: "Build/WebGL.wasm.unityweb?v=13523bf-202610121340",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "FoldArena",
        productName: "FOLD ARENA",
        productVersion: "0.4.1",
        // 手機 devicePixelRatio 常為 3：全解析度渲染對 WebGL 太重，上限壓在 2
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
        showBanner: function (message, type) { if (type === "error") showError(message); else console.warn(message); }
      }, function (progress) {
        barFill.style.width = Math.round(progress * 100) + "%";
      }).then(function (instance) {
        loading.style.display = "none";
        window.foldArenaInstance = instance;
      }).catch(function (message) {
        showError(String(message));
      });
    </script>
  </body>
</html>
